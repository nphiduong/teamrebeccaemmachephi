<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ============ WOODEN RAFT — 16-bit pixel style, no cargo/content ============ -->

  <!-- soft water shadow under the raft -->
  <rect x="6"  y="21" width="20" height="1" fill="#1f5b82" opacity="0.35"/>
  <rect x="5"  y="22" width="22" height="1" fill="#1f5b82" opacity="0.25"/>

  <!-- FOAM / SPLASH around the edges (drawn first so raft sits on top) -->
  <g fill="#eaf7ff">
    <rect x="3"  y="20" width="2" height="1"/>
    <rect x="2"  y="21" width="2" height="1"/>
    <rect x="27" y="20" width="2" height="1"/>
    <rect x="28" y="21" width="2" height="1"/>
    <rect x="4"  y="22" width="2" height="1"/>
    <rect x="26" y="22" width="2" height="1"/>
    <rect x="8"  y="23" width="2" height="1"/>
    <rect x="13" y="23" width="3" height="1"/>
    <rect x="19" y="23" width="2" height="1"/>
    <rect x="23" y="23" width="2" height="1"/>
    <rect x="6"  y="24" width="2" height="1"/>
    <rect x="10" y="24" width="2" height="1"/>
    <rect x="16" y="24" width="2" height="1"/>
    <rect x="21" y="24" width="2" height="1"/>
    <rect x="25" y="24" width="2" height="1"/>
  </g>
  <g fill="#ffffff">
    <rect x="3"  y="21" width="1" height="1"/>
    <rect x="28" y="20" width="1" height="1"/>
    <rect x="9"  y="22" width="1" height="1"/>
    <rect x="14" y="22" width="1" height="1"/>
    <rect x="20" y="22" width="1" height="1"/>
    <rect x="7"  y="23" width="1" height="1"/>
    <rect x="17" y="23" width="1" height="1"/>
    <rect x="24" y="23" width="1" height="1"/>
    <rect x="11" y="24" width="1" height="1"/>
    <rect x="22" y="24" width="1" height="1"/>
  </g>
  <g fill="#a9dcf5" opacity="0.8">
    <rect x="5"  y="20" width="1" height="1"/>
    <rect x="26" y="21" width="1" height="1"/>
    <rect x="12" y="23" width="1" height="1"/>
    <rect x="18" y="24" width="1" height="1"/>
  </g>

  <!-- RAFT BODY OUTLINE -->
  <rect x="4" y="10" width="24" height="11" fill="#4a2c17"/>

  <!-- LOG END CAPS (left & right side, showing cut-log cross-section) -->
  <g>
    <rect x="4" y="12" width="2" height="7" fill="#7a4a26"/>
    <rect x="5" y="13" width="1" height="5" fill="#d9a066"/>
    <rect x="5" y="15" width="1" height="1" fill="#b97a44"/>

    <rect x="26" y="12" width="2" height="7" fill="#7a4a26"/>
    <rect x="26" y="13" width="1" height="5" fill="#d9a066"/>
    <rect x="26" y="15" width="1" height="1" fill="#b97a44"/>
  </g>

  <!-- DECK PLANKS (horizontal wood strips) -->
  <g>
    <rect x="6" y="11" width="20" height="2" fill="#c08a52"/>
    <rect x="6" y="13" width="20" height="2" fill="#a97442"/>
    <rect x="6" y="15" width="20" height="2" fill="#8a5a34"/>
    <rect x="6" y="17" width="20" height="2" fill="#a97442"/>
    <rect x="6" y="19" width="20" height="1" fill="#8a5a34"/>
  </g>

  <!-- plank grain / seam lines -->
  <g fill="#4a2c17">
    <rect x="6" y="12" width="20" height="1"/>
    <rect x="6" y="14" width="20" height="1"/>
    <rect x="6" y="16" width="20" height="1"/>
    <rect x="6" y="18" width="20" height="1"/>
  </g>
  <g fill="#5c3a21" opacity="0.6">
    <rect x="10" y="11" width="1" height="1"/>
    <rect x="15" y="13" width="1" height="1"/>
    <rect x="20" y="15" width="1" height="1"/>
    <rect x="12" y="17" width="1" height="1"/>
    <rect x="18" y="19" width="1" height="1"/>
    <rect x="9"  y="15" width="1" height="1"/>
    <rect x="23" y="13" width="1" height="1"/>
  </g>

  <!-- ROPE BINDINGS (left and right, crossing the logs) -->
  <g fill="#3b2415">
    <!-- left rope band -->
    <rect x="9" y="10" width="2" height="11"/>
    <!-- right rope band -->
    <rect x="21" y="10" width="2" height="11"/>
  </g>
  <g fill="#6b4a2e">
    <rect x="9" y="10" width="2" height="1"/>
    <rect x="9" y="14" width="2" height="1"/>
    <rect x="9" y="20" width="2" height="1"/>
    <rect x="21" y="10" width="2" height="1"/>
    <rect x="21" y="14" width="2" height="1"/>
    <rect x="21" y="20" width="2" height="1"/>
  </g>
  <!-- rope cross-stitch detail -->
  <g fill="#5c3a21">
    <rect x="9"  y="12" width="1" height="1"/>
    <rect x="10" y="13" width="1" height="1"/>
    <rect x="10" y="17" width="1" height="1"/>
    <rect x="9"  y="18" width="1" height="1"/>
    <rect x="21" y="13" width="1" height="1"/>
    <rect x="22" y="12" width="1" height="1"/>
    <rect x="22" y="18" width="1" height="1"/>
    <rect x="21" y="17" width="1" height="1"/>
  </g>

  <!-- top highlight edge -->
  <rect x="6" y="10" width="20" height="1" fill="#dba86a"/>

  <!-- bottom hull shading -->
  <rect x="5" y="20" width="22" height="1" fill="#3a230f"/>
</svg>
