<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapids Run</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas" width="1280" height="720"></canvas>
  <div id="crt-overlay"></div>

  <section id="screen-title" class="screen active">
    <label for="player-name">Your name</label>
    <input id="player-name" type="text" maxlength="16" placeholder="Anonymous" autocomplete="off">

    <p class="prompt pulsing">Press ENTER to start</p>
  </section>

  <section id="screen-results" class="screen">
    <h2 id="results-headline">Run Complete</h2>
    <p id="results-score" class="results-score">0</p>
    <p id="results-meta"></p>

    <table id="leaderboard-table">
      <thead>
        <tr><th>Rank</th><th>Name</th><th>Score</th></tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>

    <button id="play-again-btn" class="prompt pulsing" style="cursor:pointer;background:none;border:none;">Press ENTER to play again</button>
  </section>
</div>
<script src="companies.js"></script>
<script src="game.js"></script>
</body>
</html>
